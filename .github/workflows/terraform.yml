name: terraform

on:
  pull_request:
    paths:
      - "**.tf"
      - "user_data.sh"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: fmt and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Init without backend
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate

  plan:
    name: plan
    needs: validate
    # Runs only after you set the repository variables listed in the README
    if: ${{ github.event_name == 'pull_request' && vars.AWS_ROLE_ARN != '' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=tf-aws-linux-demo/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="use_lockfile=true"

      - name: Plan
        run: terraform plan -input=false -var="alert_email=${{ vars.ALERT_EMAIL }}"
